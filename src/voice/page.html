<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent View voice</title>
<style>
  :root { color-scheme: light; --blue:#506CF7; --line:#e2e2e2; --mute:#666; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:#000; font:15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0; flex:1; }
  #state { font-size:13px; padding:3px 10px; border-radius:99px; background:#f2f2f2; color:var(--mute); }
  #state.live { background:#e9f6ee; color:#117a3d; }
  #state.busy { background:#eef1ff; color:var(--blue); }
  #state.bad { background:#fdecea; color:#b3261e; }
  main { flex:1; overflow:auto; padding:14px 18px; }
  .line { margin:0 0 10px; max-width:70ch; }
  .line b { display:block; font-size:12px; color:var(--mute); font-weight:600; }
  .you b { color:var(--blue); }
  .note { color:var(--mute); }
  footer { display:flex; gap:10px; padding:12px 18px; border-top:1px solid var(--line); }
  button { font:inherit; padding:6px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header><h1>Agent View voice</h1><span id="state">connecting to agentview</span></header>
<main id="log"><p class="note" id="hint">Pin this tab. Press <b>Ctrl+K</b> in agentview to start a call. The first time, click <b>Enable microphone</b>.</p></main>
<footer>
  <button id="enable" class="primary">Enable microphone</button>
  <button id="mute" disabled>Mute</button>
  <button id="end" disabled>End call</button>
  <div style="flex:1;align-self:center"><div style="height:6px;background:#eee;border-radius:3px"><div id="level" style="height:6px;width:0;background:#506CF7;border-radius:3px"></div></div></div>
</footer>
<audio id="out" autoplay></audio>
<script>
// Protocol with agentview (JSON text frames over ws://<host>/ws). This page holds no logic:
//   agentview -> page  {type:"start", provider}      begin a call: "openai" (mic + WebRTC offer) or "xai" (mic + websocket)
//                      {type:"answer", sdp}          the SDP answer from OpenAI
//                      {type:"answer", provider:"xai", url, token, session}  where and how to open Grok's websocket
//                      {type:"send", event}          a client event for the data channel
//                      {type:"mute", on}             mute or unmute the microphone track
//                      {type:"silence"}              stop the voice now, before the call is torn down
//                      {type:"end"}                  tear the call down
//                      {type:"retire"}               a hidden browser runs the call now: close this tab
//   page -> agentview  {type:"hello", ready, hidden} page is up; ready = microphone already allowed
//                      {type:"stage", stage}         "microphone" while waiting for permission, then "offer"
//                      {type:"offer", sdp}           SDP offer with ICE candidates gathered (xAI: {type:"offer", provider:"xai"}, no SDP)
//                      {type:"event", event}         one JSON event received on the data channel
//                      {type:"state", state}         peer connection state
//                      {type:"audio", on}            whether the browser lets the voice play yet
//                      {type:"ended", reason}        the call is over on this side
const $ = (id) => document.getElementById(id);
const stateEl = $("state"), log = $("log"), out = $("out");
// agentview runs this page in a hidden browser with `?hidden`: the microphone is allowed and there is nothing to click.
const hidden = new URLSearchParams(location.search).has("hidden");
let ws, pc, dc, stream, ready = hidden, muted = false, retired = false;
let provider = "openai", xws, ctx, capture, nextTime = 0, playing = [];
// What was said before Grok was ready to listen is kept and sent first, so speaking right after the key loses nothing.
let heardEarly = [], grokReady = false;
let youLine = null, voiceLine = null;

function setState(text, kind = "") { stateEl.textContent = text; stateEl.className = kind; }
function say(who, text) {
  const p = document.createElement("p");
  p.className = "line " + (who === "You" ? "you" : "");
  p.innerHTML = "<b></b><span></span>";
  p.firstChild.textContent = who; p.lastChild.textContent = text;
  $("hint")?.remove();
  log.appendChild(p); log.scrollTop = log.scrollHeight;
  return p.lastChild;
}
function post(message) { if (ws?.readyState === 1) ws.send(JSON.stringify(message)); }

async function allowMic() {
  const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
  probe.getTracks().forEach((t) => t.stop());
  ready = true; $("enable").hidden = true;
  post({ type: "hello", ready, hidden });
  if (!pc) setState("ready", "live");
}
$("enable").onclick = () => allowMic().catch((e) => setState("microphone blocked: " + e.name, "bad"));
$("mute").onclick = () => { muted = !muted; applyMute(); post({ type: "muted", on: muted }); };
$("end").onclick = () => end("you ended the call");

// A fresh tab may not play sound until it has been clicked once; say so, and play on the click.
function playOut() {
  out.play().then(() => post({ type: "audio", on: true })).catch(() => {
    setState("click this page once to hear the voice", "bad");
    post({ type: "audio", on: false });
  });
}
document.addEventListener("click", () => { if (out.srcObject) playOut(); ctx?.resume(); });

// How loud the microphone is, shown in the page and reported so agentview can tell a dead one.
let meterTimer = null;
function meter(media) {
  clearInterval(meterTimer);
  try {
    const context = new AudioContext();
    const analyser = context.createAnalyser();
    analyser.fftSize = 512;
    context.createMediaStreamSource(media).connect(analyser);
    const samples = new Float32Array(analyser.fftSize);
    let quiet = 0;
    meterTimer = setInterval(() => {
      analyser.getFloatTimeDomainData(samples);
      const rms = Math.sqrt(samples.reduce((sum, x) => sum + x * x, 0) / samples.length);
      $("level").style.width = Math.min(100, Math.round(rms * 400)) + "%";
      quiet = rms > 0.002 ? 0 : quiet + 1;
      if (++ticks % 2 === 0) post({ type: "mic", rms: Number(rms.toFixed(4)), flat_seconds: quiet / 2 });
    }, 500);
  } catch {}
}
let ticks = 0;

function applyMute() {
  stream?.getAudioTracks().forEach((t) => { t.enabled = !muted; });
  $("mute").textContent = muted ? "Unmute" : "Mute";
}

async function begin() {
  if (pc) return;
  out.muted = false;
  post({ type: "stage", stage: "microphone" });
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    setState("microphone blocked: " + e.name, "bad");
    post({ type: "ended", reason: `the microphone is blocked (${e.name}). On a Mac, allow your terminal or browser under System Settings, Privacy & Security, Microphone` });
    return;
  }
  ready = true; $("enable").hidden = true; muted = false; applyMute(); meter(stream);
  setState("connecting call", "busy");
  pc = new RTCPeerConnection();
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.ontrack = (e) => { out.srcObject = e.streams[0]; playOut(); };
  dc = pc.createDataChannel("oai-events");
  dc.onmessage = (m) => {
    let event; try { event = JSON.parse(m.data); } catch { return; }
    caption(event);
    post({ type: "event", event });
  };
  dc.onclose = () => end("data channel closed");
  pc.onconnectionstatechange = () => {
    post({ type: "state", state: pc?.connectionState });
    if (pc?.connectionState === "connected") setState("live", "live");
    if (pc && ["failed", "closed"].includes(pc.connectionState)) end("connection " + pc.connectionState);
  };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") return resolve();
    const done = () => pc.iceGatheringState === "complete" && (pc.removeEventListener("icegatheringstatechange", done), resolve());
    pc.addEventListener("icegatheringstatechange", done);
    setTimeout(resolve, 3000);
  });
  $("mute").disabled = false; $("end").disabled = false;
  post({ type: "stage", stage: "offer" });
  post({ type: "offer", sdp: pc.localDescription.sdp });
}

// ---- Grok: one websocket carries events and 24 kHz PCM both ways ----
const captureProcessor = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.buffer = new Float32Array(2400); this.filled = 0; }
  process(inputs) {
    const input = inputs[0][0];
    if (!input) return true;
    for (let i = 0; i < input.length; i++) {
      this.buffer[this.filled++] = input[i];
      if (this.filled === this.buffer.length) {
        const pcm = new Int16Array(this.filled);
        for (let j = 0; j < pcm.length; j++) pcm[j] = Math.max(-1, Math.min(1, this.buffer[j])) * 32767;
        this.port.postMessage(pcm.buffer, [pcm.buffer]);
        this.filled = 0;
      }
    }
    return true;
  }
}
registerProcessor("capture", Capture);`;

function toBase64(buffer) {
  let text = "";
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) text += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(text);
}

function stopPlayback() {
  playing.forEach((source) => { try { source.stop(); } catch {} });
  playing = []; nextTime = 0;
}

// The voice stops this instant: what is playing is cut and nothing more is let through.
function silence() {
  out.muted = true;
  stopPlayback();
  try { ctx?.suspend(); } catch {}
  post({ type: "silenced" });
}

function playPcm(data) {
  if (!ctx || out.muted) return;
  const text = atob(data), count = text.length >> 1;
  const buffer = ctx.createBuffer(1, count, 24000), samples = buffer.getChannelData(0);
  for (let i = 0; i < count; i++) {
    let value = text.charCodeAt(2 * i) | (text.charCodeAt(2 * i + 1) << 8);
    if (value >= 32768) value -= 65536;
    samples[i] = value / 32768;
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer; source.connect(ctx.destination);
  const at = Math.max(ctx.currentTime + 0.04, nextTime);
  source.start(at); nextTime = at + buffer.duration;
  playing.push(source);
  source.onended = () => { playing = playing.filter((item) => item !== source); };
}

async function beginXai() {
  if (ctx) return;
  out.muted = false;
  post({ type: "stage", stage: "microphone" });
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    setState("microphone blocked: " + e.name, "bad");
    post({ type: "ended", reason: `the microphone is blocked (${e.name}). On a Mac, allow your terminal or browser under System Settings, Privacy & Security, Microphone` });
    return;
  }
  ready = true; $("enable").hidden = true; muted = false; applyMute(); meter(stream);
  setState("connecting call", "busy");
  ctx = new AudioContext({ sampleRate: 24000 });
  await ctx.resume().catch(() => {});
  post({ type: "audio", on: ctx.state === "running" });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([captureProcessor], { type: "text/javascript" })));
  capture = new AudioWorkletNode(ctx, "capture");
  ctx.createMediaStreamSource(stream).connect(capture);
  heardEarly = []; grokReady = false;
  capture.port.onmessage = (e) => {
    const audio = toBase64(e.data);
    if (grokReady && xws?.readyState === 1) xws.send(JSON.stringify({ type: "input_audio_buffer.append", audio }));
    else if (heardEarly.length < 150) heardEarly.push(audio);   // up to 15 seconds
  };
  $("mute").disabled = false; $("end").disabled = false;
  post({ type: "stage", stage: "offer" });
  post({ type: "offer", provider: "xai" });
}

function openXai(msg) {
  xws = new WebSocket(msg.url, ["xai-client-secret." + msg.token]);
  xws.onopen = () => { xws.send(JSON.stringify(msg.session)); setState("live", "live"); post({ type: "state", state: "connected" }); };
  xws.onmessage = (m) => {
    let event; try { event = JSON.parse(m.data); } catch { return; }
    if (event.type === "response.output_audio.delta") return playPcm(event.delta);
    if (event.type === "session.updated" && !grokReady) {
      // A resumed conversation contains old screen references. Put the current
      // one at the end of history before releasing speech buffered during startup.
      if (msg.context) xws.send(JSON.stringify({ type: "conversation.item.create", item: {
        type: "message", role: "system", content: [{ type: "input_text", text: msg.context }]
      }}));
      grokReady = true;
      for (const audio of heardEarly) xws.send(JSON.stringify({ type: "input_audio_buffer.append", audio }));
      heardEarly = [];
    }
    if (event.type === "input_audio_buffer.speech_started") stopPlayback();
    caption(event);
    if (event.type !== "ping") post({ type: "event", event });
  };
  xws.onclose = () => end("Grok closed the connection");
  xws.onerror = () => post({ type: "state", state: "failed" });
}

// Grok says a tool's result was sent; the next answer waits for the voice to finish the last sentence.
function sendXai(event) {
  if (xws?.readyState !== 1) return;
  const text = JSON.stringify(event);
  if (event.type === "response.create" && ctx) {
    setTimeout(() => xws?.readyState === 1 && xws.send(text), Math.max(0, (nextTime - ctx.currentTime) * 1000));
  } else xws.send(text);
}

function caption(event) {
  const type = event.type;
  if (type === "session.input_transcript.delta") { voiceLine = null; youLine ||= say("You", ""); youLine.textContent += event.delta; }
  else if (type === "session.output_transcript.delta") { youLine = null; voiceLine ||= say("Agent View", ""); voiceLine.textContent += event.delta; }
  else if (type === "conversation.item.input_audio_transcription.completed") { voiceLine = null; youLine = say("You", event.transcript || ""); youLine = null; }
  else if (type === "response.output_audio_transcript.delta") { youLine = null; voiceLine ||= say("Agent View", ""); voiceLine.textContent += event.delta; }
  else if (type === "response.done") { voiceLine = null; }
}

function end(reason) {
  if (!pc && !stream && !ctx) return;
  try { dc?.close(); } catch {}
  try { pc?.close(); } catch {}
  try { xws?.close(); } catch {}
  try { stopPlayback(); capture?.disconnect(); ctx?.close(); } catch {}
  stream?.getTracks().forEach((t) => t.stop());
  clearInterval(meterTimer);
  pc = dc = stream = xws = ctx = capture = null; youLine = voiceLine = null; heardEarly = []; grokReady = false;
  out.srcObject = null;
  $("mute").disabled = true; $("end").disabled = true;
  setState(ready ? "ready" : "idle", ready ? "live" : "");
  post({ type: "ended", reason });
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    setState(ready ? "ready" : "idle", ready ? "live" : "");
    post({ type: "hello", ready, hidden });
  };
  ws.onmessage = async (m) => {
    let msg; try { msg = JSON.parse(m.data); } catch { return; }
    if (msg.type === "start") { provider = msg.provider || "openai"; provider === "xai" ? beginXai() : begin(); }
    else if (msg.type === "answer" && msg.provider === "xai" && ctx) openXai(msg);
    else if (msg.type === "answer" && pc) await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
    else if (msg.type === "send" && provider === "xai") sendXai(msg.event);
    else if (msg.type === "send" && dc?.readyState === "open") dc.send(JSON.stringify(msg.event));
    else if (msg.type === "mute") { muted = !!msg.on; applyMute(); }
    else if (msg.type === "silence") silence();
    else if (msg.type === "end") end(msg.reason || "ended by agentview");
    else if (msg.type === "retire") { retired = true; setState("not needed: agentview runs the voice in the background now. Close this tab.", "bad"); $("enable").hidden = true; }
  };
  ws.onclose = () => {
    end("agentview went away");
    if (retired) return;
    setState("waiting for agentview", "bad");
    setTimeout(connect, 2000);
  };
}
if (hidden) $("enable").hidden = true;
navigator.permissions?.query({ name: "microphone" }).then((p) => {
  if (p.state === "granted") { ready = true; $("enable").hidden = true; }
}).catch(() => {});
connect();
</script>
</body>
</html>
