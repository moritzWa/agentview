name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # auto-release.yml starts this after it tags main. A tag pushed with the
  # workflow token does not trigger the tag event above.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, such as v0.3.4
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Stamp the crate version from the tag
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          export version
          # Only the first `version =` line, which is the package's own.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{version}"/m' Cargo.toml
          perl -0pi -e 's/(name = "betteragentview"\r?\nversion = )"[^"]*"/$1"$ENV{version}"/' Cargo.lock
          grep -m1 '^version' Cargo.toml
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # Only published builds check GitHub for a newer release.
          AGENTVIEW_RELEASE_BUILD: "1"
      - if: runner.os != 'Windows'
        run: scripts/package-release.sh ${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-release.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "BetterAgentView ${RELEASE_TAG}"
