name: mobile bridge

on:
  push:
    paths:
      - 'bridge/**'
      - '.github/workflows/mobile-bridge.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/mobile-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
